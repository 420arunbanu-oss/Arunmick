name: Build SmartDrivo Free APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Locate and prepare APK
      run: |
        mkdir -p output-apk
        find . -name "*debug*.apk" -exec cp {} output-apk/SmartDrivo-Free.apk \;
        ls -la output-apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmartDrivo-OpenSource-Free-APK
        path: output-apk/SmartDrivo-Free.apk
        retention-days: 30
